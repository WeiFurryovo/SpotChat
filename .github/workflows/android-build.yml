name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Test
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint debug
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare ephemeral test-only debug APK artifact
        run: |
          mkdir -p artifacts
          APK_NAME="SpotChat-test-only-debug-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/${APK_NAME}"
          {
            echo "### SpotChat test-only debug APK"
            echo
            echo "- File: \`${APK_NAME}\`"
            echo "- Package: \`com.weifurry.spotchat.debug\` (separate from release)"
            echo "- Signing: ephemeral debug key generated on this GitHub-hosted runner"
            echo "- Upgrade warning: a later workflow APK will normally have a different signature and cannot predictably upgrade this build. Uninstall the previous debug build first if installation fails."
            echo "- Release warning: this artifact is for testing only and must not be distributed as a production release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ephemeral test-only debug APK
        uses: actions/upload-artifact@v6
        with:
          name: SpotChat-test-only-ephemeral-debug-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
