name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Test
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare fixed-signed APK artifact
        run: |
          mkdir -p artifacts
          APK_NAME="SpotChat-debug-fixed-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/${APK_NAME}"
          {
            echo "### SpotChat APK"
            echo
            echo "- File: \`${APK_NAME}\`"
            echo "- Signing: fixed repository debug key \`app/signing/spotchat-debug.keystore\`"
            echo "- Install type: debug APK, can upgrade over future Action builds with the same package name."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fixed-signed debug APK
        uses: actions/upload-artifact@v6
        with:
          name: SpotChat-debug-fixed-signed-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
